<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F88 - GPS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      background: #f4f6f9;
      margin: 0;
      padding: 8px;
      height: 100vh;
      overflow: hidden;
      font-size: 14px;
    }

    .main-wrapper {
      display: flex;
      gap: 8px;
      height: calc(100vh - 72px);
      min-height: 420px;
    }

    .main-wrapper.has-sidebar-hidden {
      gap: 0;
    }

    .sidebar-panel {
      width: 440px;
      min-width: 240px;
      background: #fff;
      border-radius: 12px;
      border: 1px solid #d9dee5;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      padding: 10px;
      display: flex;
      flex-direction: column;
      transition: width 0.2s ease, opacity 0.2s ease, padding 0.2s ease, border 0.2s ease;
    }

    .main-wrapper.has-sidebar-hidden .sidebar-panel {
      width: 0;
      min-width: 0;
      padding: 0;
      margin: 0;
      opacity: 0;
      border: none;
      overflow: hidden;
      pointer-events: none;
      flex-basis: 0;
    }

    .main-wrapper.has-sidebar-hidden .map-panel {
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
      border-radius: 12px 12px 12px 12px;
    }

    .map-action-group {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .map-action-group .btn {
      white-space: nowrap;
    }

    .customer-item-card {
      background: #f8f9fa;
      border: 1px solid #d6dce5;
      border-left: 4px solid #adb5bd;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.45);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .customer-item-card[data-status="gps-main"] {
      border-left-color: #0d6efd;
      background: linear-gradient(180deg, #f1f7ff 0%, #ffffff 100%);
    }

    .customer-item-card[data-status="gps-check"] {
      border-left-color: #198754;
      background: linear-gradient(180deg, #edfdf5 0%, #ffffff 100%);
    }

    .customer-item-card[data-status="gps-ap"] {
      border-left-color: #f59e0b;
      background: linear-gradient(180deg, #fff8eb 0%, #ffffff 100%);
    }

    .customer-item-card[data-status="gps-none"] {
      border-left-color: #dc3545;
      background: linear-gradient(180deg, #fff2f2 0%, #ffffff 100%);
    }

    .customer-item-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 12px rgba(15, 23, 42, 0.08);
    }

    .customer-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
    }

    .customer-summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      min-height: 46px;
    }

    .customer-summary-main {
      min-width: 0;
      flex: 1 1 auto;
    }

    .customer-summary-side {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .customer-name {
      font-size: 15px;
      font-weight: 800;
      color: #0d3b66;
      margin: 0;
      line-height: 1.3;
    }

    .map-card-toggle {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #eef4ff;
      color: #0d6efd;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid #cfe0ff;
      flex-shrink: 0;
    }

    .customer-phone {
      font-size: 12px;
      color: #4b5563;
      margin-top: 2px;
      font-weight: 600;
    }

    .customer-status-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 78px;
      padding: 5px 8px;
      border-radius: 6px;
      background: #e8f3ff;
      border: 1px solid #9dc4f5;
      color: #0d6efd;
      font-size: 11px;
      font-weight: 700;
    }

    .customer-meta {
      font-size: 12px;
      color: #495057;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .distance-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #e8f5e9;
      color: #198754;
      border: 1px solid #9ad0a7;
      font-weight: 700;
      border-radius: 999px;
      padding: 4px 8px;
      margin-bottom: 8px;
      font-size: 11px;
      white-space: nowrap;
    }

    .gps-status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .gps-mini-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 4px;
    }

    .customer-detail-panel {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #dfe7f1;
    }

    .gps-mini-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 5px 7px;
      background: #f1f5f9;
      border: 1px solid #dbe4ee;
      border-radius: 6px;
      font-size: 11px;
      line-height: 1.4;
    }

    .gps-mini-label {
      font-weight: 700;
      color: #0d3b66;
    }

    .gps-mini-value {
      color: #374151;
      word-break: break-word;
    }

    .gps-mini-action {
      border: none;
      background: transparent;
      color: #0d6efd;
      padding: 0;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
    }

    .customer-action-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .legacy-check-btn {
      border-radius: 6px;
      border: none;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 10px;
      min-width: 110px;
    }

    .map-panel {
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
      border-radius: 12px;
      border: 1px solid #d9dee5;
      overflow: hidden;
      background: #e9ecef;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 320px;
    }

    .gps-marker-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      color: #fff;
      font-weight: bold;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      border: 2px solid white;
    }

    .my-location-marker {
      width: 16px;
      height: 16px;
      background: #dc3545;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    @media (max-width: 992px) {
      body {
        overflow: auto;
        height: auto;
      }
      .main-wrapper {
        height: auto;
        flex-direction: column;
      }
      .sidebar-panel {
        width: 100%;
        max-height: 50vh;
      }
      .map-panel {
        height: 50vh;
      }
    }

    @media (max-width: 576px) {
      .map-action-group {
        gap: 4px;
      }
      .map-action-group .map-action-label {
        display: none;
      }
      .map-action-group .btn {
        min-width: 40px;
        padding-left: 0.5rem;
        padding-right: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container-fluid p-1">
    <div class="d-flex justify-content-between align-items-center mb-2 bg-white p-2 rounded shadow-sm flex-wrap gap-2">
      <div class="d-flex align-items-center">
        <h5 class="mb-0 fw-bold text-danger">🗺️ Bản Đồ F88</h5>
        <span class="badge bg-primary ms-2 fs-6" id="currentMapPeriodBadge">Kỳ: ---</span>
      </div>
      <div class="bg-light px-3 py-1 rounded border text-secondary fw-bold small">
        📊 Tổng khách: <span id="statCustomers" class="text-primary">0</span> |
        📌 Tổng điểm GPS: <span id="statGpsPoints" class="text-success">0</span>
      </div>
      <div class="map-action-group">
        <button class="btn btn-outline-primary btn-sm fw-bold" type="button" onclick="locateMyPosition()" title="Định vị lại">
          <span class="map-action-label">📍 Định vị lại</span>
          <span class="d-inline d-sm-none">📍</span>
        </button>
        <button class="btn btn-success btn-sm fw-bold" type="button" onclick="loadMapDataAndRender()" title="Tải dữ liệu">
          <span class="map-action-label">🔄 Tải dữ liệu</span>
          <span class="d-inline d-sm-none">🔄</span>
        </button>
        <button class="btn btn-outline-secondary btn-sm fw-bold" type="button" data-bs-toggle="offcanvas" data-bs-target="#mapFilterDrawer" title="Bộ lọc">
          <span class="map-action-label">⚙️ Bộ lọc</span>
          <span class="d-inline d-sm-none">⚙️</span>
        </button>
        <div class="dropdown">
          <button class="btn btn-primary btn-sm fw-bold dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            ☰
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
            <li><a class="dropdown-item" href="index.html">📋 Danh sách</a></li>
            <li><a class="dropdown-item" href="ap.html">🏡 Ấp</a></li>
            <li><a class="dropdown-item" href="payment.html">💰 Khách nguồn</a></li>
            <li><a class="dropdown-item" href="sync.html">🔄 Đồng Bộ</a></li>
          </ul>
        </div>
        <button id="toggleMapListBtn" class="btn btn-outline-primary btn-sm fw-bold d-lg-none" onclick="toggleMapSidebar()" title="Ẩn danh sách">
          ☰
        </button>
      </div>
    </div>

    <div id="mainMapWrapper" class="main-wrapper">
      <div class="sidebar-panel" id="mapSidebarPanel">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="fw-bold text-primary mb-0">📋 Danh Sách Khách</h6>
          <button class="btn btn-outline-secondary btn-sm" onclick="toggleAllCustomerFocus()">Hiển thị tất cả</button>
        </div>
        <div id="sidebarCustomerList" style="flex-grow: 1; overflow-y: auto; padding-right: 4px;">
          <div class="text-center text-muted py-4">Đang tải dữ liệu...</div>
        </div>
      </div>

      <div class="map-panel shadow-sm">
        <div id="map"></div>
      </div>
    </div>
  </div>

  <div class="offcanvas offcanvas-end" tabindex="-1" id="mapFilterDrawer">
    <div class="offcanvas-header bg-danger text-white">
      <h5 class="offcanvas-title fw-bold">⚙️ Bộ Lọc Bản Đồ</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <div class="mb-3">
        <label class="form-label fw-bold small">Kỳ tháng:</label>
        <select id="mapMonth" class="form-select" onchange="loadMapDataAndRender()"><option value="">-- Tất cả tháng --</option></select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Trạng Thái Check:</label>
        <select id="mapCheckState" class="form-select fw-bold text-danger" onchange="filterAndRenderMap()">
          <option value="chua_check" selected>🔴 Chưa check</option>
          <option value="tat_ca">⚡ Tất cả</option>
          <option value="da_check">🟢 Đã check</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">📍 Loại GPS:</label>
        <select id="mapGpsType" class="form-select fw-bold text-primary" onchange="filterAndRenderMap()">
          <option value="all" selected>⚡ Tất cả loại GPS</option>
          <option value="GPS_Chinh">GPS chính</option>
          <option value="GPS_CHECK_1_5">GPS check (1 tới 5)</option>
          <option value="GPS_AP_NEW">Ấp New</option>
          <option value="GPS_AP_OLD">Ấp Old</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Trạng Thái Thanh Toán:</label>
        <select id="mapThanhToan" class="form-select" onchange="filterAndRenderMap()">
          <option value="chua_thanh_toan" selected>Chưa thanh toán (Dưới 500k)</option>
          <option value="da_thanh_toan_tren_500k">Đã thanh toán trên 500.000</option>
          <option value="">Tất cả</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Tìm kiếm khách hàng:</label>
        <input type="text" id="mapSearch" class="form-control" placeholder="Tên khách, số HĐ..." oninput="filterAndRenderMap()" />
      </div>
      <button class="btn btn-outline-secondary w-100 mt-3" onclick="resetMapFilters()">🔄 Đặt lại lọc</button>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="api.js"></script>
  <script src="map.js"></script>
</body>
</html>
