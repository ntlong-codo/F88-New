<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F88 - Đồng Bộ</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { background: #f4f6f9; font-size: 15px; }
    .card { border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .btn { min-height: 42px; }
    #apMapCanvas {
      width: 100%;
      height: 420px;
      min-height: 420px;
      max-height: 420px;
      overflow: hidden;
      position: relative;
      background: #edf2f7;
    }
    #apMapCanvas .leaflet-container {
      width: 100% !important;
      height: 100% !important;
      position: relative !important;
      z-index: 1;
    }
    .leaflet-popup { z-index: 1200 !important; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { z-index: 1201 !important; }

    .ap-popup-shell {
      min-width: 220px;
      max-width: 260px;
      font-size: 13px;
      color: #1f2937;
    }
    .ap-popup-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e5e7eb;
    }
    .ap-popup-title {
      margin: 0;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.3;
    }
    .ap-popup-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.02em;
    }
    .ap-popup-badge.old { background: #dc2626; }
    .ap-popup-badge.new { background: #2563eb; }
    .ap-popup-meta {
      padding: 8px 10px;
      border-radius: 10px;
      background: linear-gradient(180deg, #f8fafc 0%, #eef6ff 100%);
      border: 1px solid #dbeafe;
      margin-bottom: 8px;
    }
    .ap-popup-meta strong {
      color: #0f172a;
    }
    .ap-popup-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .ap-popup-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 10px;
      border: none;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.12);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .ap-popup-action:hover {
      transform: translateY(-1px);
      opacity: 0.96;
      color: #fff;
    }
    .ap-popup-action.route { background: linear-gradient(135deg, #16a34a, #22c55e); }
    .ap-popup-action.gps { background: linear-gradient(135deg, #2563eb, #3b82f6); }
    .ap-popup-action.edit { background: linear-gradient(135deg, #d97706, #f59e0b); }
    .ap-popup-action .action-text { display: inline; }

    @media (max-width: 576px) {
      .ap-popup-shell {
        min-width: 180px;
        max-width: 220px;
      }
      .ap-popup-action {
        width: 38px;
        height: 38px;
        padding: 0;
        border-radius: 50%;
      }
      .ap-popup-action .action-text {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3 bg-white p-3 rounded shadow-sm flex-wrap gap-2">
      <div>
        <h4 class="mb-0 fw-bold text-warning">🏡 F88</h4>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <a href="index.html" class="btn btn-primary btn-sm">📋 Danh sách</a>
        <a href="map.html" class="btn btn-danger btn-sm">🗺️ Map</a>
        <a href="ap.html" class="btn btn-warning btn-sm">🏡 Ấp</a>
        <a href="payment.html" class="btn btn-success btn-sm">💰 Khách Nguồn</a>
        <a href="sync.html" class="btn btn-info btn-sm text-white">🔄 Đồng Bộ</a>
      </div>
    </div>

    <div class="card p-3 mt-4">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <h5 class="fw-bold text-danger mb-0">🏡 Danh sách ấp và GPS</h5>
          <button id="toggleApListBtn" class="btn btn-outline-primary btn-sm fw-bold" type="button" onclick="toggleApListPanel()">▾ Mở danh sách</button>
        </div>
        <div class="d-flex gap-2 small text-muted align-items-center">
          <span class="badge bg-primary">Tổng: <b id="statTotal">0</b></span>
          <span class="badge bg-danger">Chưa GPS: <b id="statNoGps">0</b></span>
          <button id="openAddApModalBtn" class="btn btn-outline-danger btn-sm fw-bold" type="button" onclick="openAddApLocationModal()">➕ Thêm ấp</button>
        </div>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-12 col-md-4">
          <label class="form-label fw-bold small mb-1">Loại ấp:</label>
          <select id="selectTab" class="form-select">
            <option value="all">⚡ Tất cả</option>
            <option value="ap_new">Ấp mới</option>
            <option value="ap_old">Ấp cũ</option>
          </select>
        </div>
        <div class="col-12 col-md-5">
          <label class="form-label fw-bold small mb-1">Tìm kiếm:</label>
          <input id="searchApKeyword" type="text" class="form-control" placeholder="Tên ấp, xã, huyện..." />
        </div>
        <div class="col-12 col-md-3">
          <label class="form-label fw-bold small mb-1">Lọc danh sách:</label>
          <div class="form-check mt-2">
            <input id="filterNoGps" class="form-check-input" type="checkbox" />
            <label class="form-check-label small" for="filterNoGps">Chỉ ấp chưa GPS</label>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3 gap-2 flex-wrap">
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <div class="small text-muted fw-bold">🧭 Bản đồ vị trí ấp</div>
          <span id="apMapStatusBadge" class="badge bg-secondary">Đang tải...</span>
          <span id="apMapPointCount" class="badge bg-info text-dark">0 điểm</span>
        </div>
      </div>

      <div id="apMapPanel" class="mt-2">
        <div class="border rounded overflow-hidden shadow-sm" style="height: 420px; min-height: 300px;">
          <div id="apMapCanvas" style="width:100%; height:100%; background:#edf2f7;" aria-label="Bản đồ ấp"></div>
        </div>
      </div>

      <div class="mt-4">
        <div id="apCardContainer" class="d-grid gap-2" style="max-height: 560px; overflow-y: auto;">
          <div class="text-center text-muted py-5 bg-light rounded border">Đang tải dữ liệu ấp...</div>
        </div>
      </div>

    </div>
  </div>

  <div class="modal fade" id="gpsPickerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title fw-bold" id="modalTitle">📍 GPS ấp</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="modalAddressInfo" class="small text-muted mb-2"></div>
          <div class="input-group mb-3">
            <input id="modalGpsInput" type="text" class="form-control" placeholder="Ví dụ: 10.123456, 105.765432" />
            <button class="btn btn-primary" type="button" onclick="getCurrentLocationMobile()">📍 Lấy vị trí</button>
          </div>
          <div id="mapPicker" style="height: 320px; width: 100%; border-radius: 10px; overflow: hidden; border: 1px solid #dee2e6;"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
          <button type="button" class="btn btn-success" onclick="saveGpsFromModal()">💾 Lưu GPS</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="addApLocationModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-warning text-dark">
          <h5 class="modal-title fw-bold">🏡 Thêm vị trí ấp</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-bold small">Loại ấp:</label>
              <select id="newApType" class="form-select" onchange="toggleApInsertFields()">
                <option value="ap_new">Ấp mới</option>
                <option value="ap_old">Ấp cũ</option>
              </select>
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label fw-bold small">Ấp:</label>
              <input id="newApName" type="text" class="form-control" placeholder="Ví dụ: Bờ Sông" />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label fw-bold small">Xã:</label>
              <input id="newApXa" type="text" class="form-control" placeholder="Ví dụ: Phường 1" />
            </div>

            <div class="col-12 col-md-6" id="newApHuyenWrap">
              <label class="form-label fw-bold small">Huyện:</label>
              <input id="newApHuyen" type="text" class="form-control" placeholder="Ví dụ: Ninh Kiều" />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label fw-bold small">Tỉnh:</label>
              <input id="newApTinh" type="text" class="form-control" value="Cần Thơ" />
            </div>

            <div class="col-12">
              <label class="form-label fw-bold small">GPS hiện tại:</label>
              <div class="input-group">
                <input id="newApGps" type="text" class="form-control" placeholder="10.123456, 105.765432" />
                <button class="btn btn-primary" type="button" onclick="getCurrentLocationForNewAp()">📍 Lấy vị trí</button>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
          <button id="saveNewApLocationBtn" type="button" class="btn btn-success" onclick="saveNewApLocation()" disabled>💾 Lưu</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1060;"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="api.js"></script>
  <script>
    let allApData = { ap_new: [], ap_old: [] };
    let currentEditingRow = null;
    let currentEditingTab = null;
    let mapPickerObj = null;
    let pickerMarker = null;
    let hasCenteredMapOnCurrentLocation = false;
    let apRenderTimer = null;
    let apListExpanded = false;
    let apDataLoaded = false;

    window.apMapState = {
      map: null,
      markersLayer: null,
      allData: [],
      filteredData: [],
      markerRegistry: {},
      focusedApKey: null,
      skipRender: false,
      hasAppliedBounds: false
    };

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[char]));
    }

    function setStatus(message, type) {
      const box = document.getElementById('statusBox');
      if (!box) return;
      box.className = 'alert mb-0 alert-' + (type || 'secondary');
      box.textContent = message;
    }

    function toggleApInsertFields() {
      const type = document.getElementById('newApType')?.value || 'ap_new';
      const huyenWrap = document.getElementById('newApHuyenWrap');
      if (type === 'ap_old') {
        huyenWrap.style.display = 'block';
      } else {
        huyenWrap.style.display = 'none';
      }
    }

    function openAddApLocationModal() {
      const modal = new bootstrap.Modal(document.getElementById('addApLocationModal'));
      document.getElementById('newApType').value = 'ap_new';
      document.getElementById('newApName').value = '';
      document.getElementById('newApXa').value = '';
      document.getElementById('newApHuyen').value = '';
      document.getElementById('newApTinh').value = 'Cần Thơ';
      document.getElementById('newApGps').value = '';
      document.getElementById('saveNewApLocationBtn').disabled = true;
      toggleApInsertFields();
      modal.show();
    }

    function getCurrentLocationForNewAp() {
      if (!navigator.geolocation) {
        alert('Trình duyệt không hỗ trợ định vị!');
        return;
      }

      navigator.geolocation.getCurrentPosition((pos) => {
        const lat = pos.coords.latitude.toFixed(6);
        const lng = pos.coords.longitude.toFixed(6);
        document.getElementById('newApGps').value = `${lat}, ${lng}`;
        document.getElementById('saveNewApLocationBtn').disabled = !document.getElementById('newApGps').value.trim();
        showToast('Đã lấy vị trí hiện tại!');
      }, () => {
        alert('Không thể lấy vị trí hiện tại. Vui lòng cấp quyền GPS.');
      }, { enableHighAccuracy: true });
    }

    async function saveNewApLocation() {
      const tabName = document.getElementById('newApType').value;
      const ap = (document.getElementById('newApName').value || '').trim();
      const xa = (document.getElementById('newApXa').value || '').trim();
      const huyen = (document.getElementById('newApHuyen').value || '').trim();
      const tinh = (document.getElementById('newApTinh').value || 'Cần Thơ').trim() || 'Cần Thơ';
      const gps = (document.getElementById('newApGps').value || '').trim();

      if (!ap || !xa || !gps) {
        showToast('Vui lòng nhập ấp, xã và GPS trước khi lưu.', 'danger');
        return;
      }

      if (tabName === 'ap_old' && !huyen) {
        showToast('Với ấp cũ, vui lòng nhập huyện.', 'danger');
        return;
      }

      try {
        const result = await window.F88_API.post('saveApLocationEntry', {
          tabName,
          ap,
          xa,
          huyen,
          tinh,
          gps
        });

        if (result && result.success) {
          showToast(result.message || 'Đã lưu vị trí ấp thành công.', 'success');
          const addModalEl = document.getElementById('addApLocationModal');
          const addModalInst = bootstrap.Modal.getInstance(addModalEl);
          if (addModalInst) addModalInst.hide();
          await loadApData();
        } else {
          showToast((result && result.message) || 'Không thể lưu vị trí ấp.', 'danger');
        }
      } catch (error) {
        showToast('Lỗi lưu vị trí ấp: ' + error.message, 'danger');
      }
    }

    function getApAddressText(item, tabName) {
      if (tabName === 'ap_new') {
        return [item.ap || '---', item.xaphuong || '---', item.tinhtp || '---'].join(' • ');
      }
      return [item.ap || '---', item.xaphuong || '---', item.quanhuyen || '---', item.tinhtp || '---'].join(' • ');
    }

    function hasApGpsValue(rawValue) {
      const normalized = normalizeApGpsString(rawValue || '');
      if (!normalized) return false;
      return !!parseApGpsCoordinates(normalized);
    }

    function getVisibleApEntries(options = {}) {
      const { applyNoGpsFilter = false } = options;
      const selectTab = document.getElementById('selectTab');
      const keyword = (document.getElementById('searchApKeyword').value || '').toLowerCase();
      const onlyNoGps = document.getElementById('filterNoGps').checked && applyNoGpsFilter;
      const tabValue = selectTab ? selectTab.value : 'all';
      const sources = tabValue === 'all' ? ['ap_new', 'ap_old'] : [tabValue];

      const entries = [];
      sources.forEach((tabName) => {
        (allApData[tabName] || []).forEach((item) => {
          const hasGps = hasApGpsValue(item.gps);
          const searchText = `${item.ap || ''} ${item.xaphuong || ''} ${item.quanhuyen || ''} ${item.tinhtp || ''}`.toLowerCase();
          const matchesKeyword = !keyword || searchText.includes(keyword);
          const matchesGps = !onlyNoGps || !hasGps;
          if (matchesKeyword && matchesGps) {
            entries.push({ ...item, tabName });
          }
        });
      });

      return entries;
    }

    function getApMarkerKey(item) {
      return `${item.tabName || 'ap'}|${Number(item.rowIndex || 0)}`;
    }

    function getApMarkerColor(item) {
      return item && item.tabName === 'ap_old' ? '#d92d2d' : '#0d3b8c';
    }

    function buildApPopupHtml(item, gps, coords) {
      const itemAddress = getApAddressText(item, item.tabName || 'ap_new');
      const kindLabel = item.tabName === 'ap_old' ? 'Ấp cũ' : 'Ấp mới';
      const googleUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(`${coords.lat},${coords.lng}`)}`;
      const rowIndex = Number(item.rowIndex || 0);
      return `
        <div class="ap-popup-shell">
          <div class="ap-popup-header">
            <div class="ap-popup-title">${escapeHtml(item.ap || 'Ấp')}</div>
            <span class="ap-popup-badge ${item.tabName === 'ap_old' ? 'old' : 'new'}">${kindLabel}</span>
          </div>
          <div class="ap-popup-meta">
            <div class="mb-1"><strong>Địa chỉ:</strong> ${escapeHtml(itemAddress)}</div>
            <div><strong>GPS:</strong> ${escapeHtml(gps)}</div>
          </div>
          <div class="ap-popup-actions">
            <a class="ap-popup-action route" href="${googleUrl}" target="_blank" rel="noopener noreferrer" title="Đường đi"><span class="action-emoji">🚗</span><span class="action-text">Đi đến</span></a>
            <button type="button" class="ap-popup-action gps" onclick="openApGpsModal('${item.tabName}', ${rowIndex}); return false;" title="GPS"><span class="action-emoji">📍</span><span class="action-text">GPS</span></button>
            <button type="button" class="ap-popup-action edit" onclick="openApEditModal('${item.tabName}', ${rowIndex}); return false;" title="Sửa"><span class="action-emoji">✏️</span><span class="action-text">Sửa</span></button>
          </div>
        </div>
      `;
    }

    function scheduleApRender() {
      if (apRenderTimer) {
        clearTimeout(apRenderTimer);
      }
      apRenderTimer = setTimeout(() => {
        renderApList();
      }, 120);
    }

    function centerMapOnCurrentLocation() {
      if (!window.apMap || hasCenteredMapOnCurrentLocation) return;
      if (!navigator.geolocation) {
        hasCenteredMapOnCurrentLocation = true;
        return;
      }

      navigator.geolocation.getCurrentPosition((position) => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        window.apMap.setView([lat, lng], 14);
        hasCenteredMapOnCurrentLocation = true;
      }, () => {
        window.apMap.setView([10.03, 105.77], 12);
        hasCenteredMapOnCurrentLocation = true;
      }, { enableHighAccuracy: true, timeout: 10000 });
    }

    function ensureApMap() {
      if (!window.apMapState) {
        window.apMapState = {
          map: null,
          markersLayer: null,
          allData: [],
          filteredData: [],
          markerRegistry: {},
          focusedApKey: null,
          skipRender: false,
          hasAppliedBounds: false
        };
      }

      if (!window.apMapState.map) {
        const apMap = L.map('apMapCanvas', {
          zoomControl: true,
          attributionControl: true
        }).setView([10.03, 105.77], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap'
        }).addTo(apMap);

        window.apMapState.map = apMap;
        window.apMapState.markersLayer = L.layerGroup().addTo(apMap);
      }

      window.apMap = window.apMapState.map;
      window.apMapLayer = window.apMapState.markersLayer;
      window.apMarkerRegistry = window.apMapState.markerRegistry;

      setTimeout(() => {
        if (window.apMap) {
          window.apMap.invalidateSize();
        }
      }, 120);
    }

    function normalizeCommuneName(value) {
      const normalized = String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\b(tx|thi xa|thị xã)\b/gi, '')
        .replace(/\b(phuong|phường|xa|xã|thị trấn|tt|thôn|thon|xom)\b/gi, ' ')
        .replace(/[^a-zA-Z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();

      return normalized || 'khong-ten';
    }

    function resolveApMarkerLabels(entries) {
      const labelsByKey = {};
      const communeLetterMap = {};
      const communeOrder = [];
      const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

      const getCommuneKey = (item) => {
        const communeName = item.xaphuong || item.xa || item.quanhuyen || item.huyen || item.tinhtp || item.tinh || 'khong-ten';
        return normalizeCommuneName(communeName);
      };

      entries.forEach((item) => {
        const communeKey = getCommuneKey(item);
        if (!communeLetterMap[communeKey]) {
          communeLetterMap[communeKey] = communeOrder.length;
          communeOrder.push(communeKey);
        }
      });

      entries.forEach((item) => {
        const key = `${item.tabName || 'ap'}|${Number(item.rowIndex || 0)}`;
        const communeKey = getCommuneKey(item);
        const letterIndex = communeLetterMap[communeKey] ?? 0;
        labelsByKey[key] = alphabet[letterIndex % alphabet.length] || 'A';
      });

      return labelsByKey;
    }

    function getApMarkerIcon(item, label) {
      const fillColor = getApMarkerColor(item);
      const markerText = (label || 'A').toUpperCase();
      return L.divIcon({
        className: 'ap-pin-marker',
        html: `
          <div style="
            width:20px; height:20px; border-radius:50%;
            background:${fillColor};
            border:2px solid rgba(255,255,255,0.95);
            box-shadow:0 8px 18px rgba(0,0,0,0.22);
            display:flex;
            align-items:center;
            justify-content:center;
            position:relative;
            transform:translateZ(0);
            color:#fff;
            font-size:10px;
            font-weight:800;
            line-height:1;
            user-select:none;
          ">${escapeHtml(markerText)}</div>
        `,
        iconSize: [20, 20],
        iconAnchor: [10, 10],
        popupAnchor: [0, -8]
      });
    }

    function normalizeApGpsString(rawValue) {
      const value = String(rawValue || '')
        .trim()
        .replace(/^gps\s*[:=]\s*/i, '')
        .replace(/lat\s*[:=]/i, '')
        .replace(/lng\s*[:=]/i, '')
        .replace(/[()]/g, '')
        .replace(/[|]/g, ',')
        .replace(/;/g, ',')
        .replace(/[°NSEW]/gi, '')
        .replace(/[^\d,.-]/g, ' ')
        .trim();

      if (!value) return '';

      const numberMatches = (value.match(/-?\d+(?:[.,]\d+)?/g) || []).map((item) => item.replace(',', '.'));
      if (numberMatches.length >= 4) {
        const lat = Number(`${numberMatches[0]}.${numberMatches[1]}`);
        const lng = Number(`${numberMatches[2]}.${numberMatches[3]}`);
        if (!Number.isNaN(lat) && !Number.isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
          return `${lat}, ${lng}`;
        }
      }

      if (numberMatches.length >= 2) {
        const lat = Number(numberMatches[0]);
        const lng = Number(numberMatches[1]);
        if (!Number.isNaN(lat) && !Number.isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
          return `${lat}, ${lng}`;
        }
      }

      return value;
    }

    function parseApGpsCoordinates(rawValue) {
      const value = normalizeApGpsString(rawValue);
      if (!value) return null;

      const parts = value.split(/[\s,]+/).filter(Boolean);
      if (parts.length >= 2) {
        const lat = Number(parts[0]);
        const lng = Number(parts[1]);
        if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
          return { lat, lng };
        }
      }

      return null;
    }

    function focusApMarker(tabName, rowIndex) {
      const item = (allApData[tabName] || []).find((entry) => Number(entry.rowIndex) === Number(rowIndex));
      if (!item) return;

      const gps = normalizeApGpsString(item.gps || '');
      const coords = parseApGpsCoordinates(gps);
      if (!coords) {
        showToast('Ấp này chưa có GPS để hiển thị trên bản đồ.', 'warning');
        return;
      }

      ensureApMap();
      const markerKey = getApMarkerKey({ ...item, tabName });
      let marker = window.apMarkerRegistry && window.apMarkerRegistry[markerKey];

      if (!marker) {
        const markerKeyLocal = getApMarkerKey({ ...item, tabName });
        const markerLabel = resolveApMarkerLabels([{ ...item, tabName }])[markerKeyLocal] || 'A';
        marker = L.marker([coords.lat, coords.lng], {
          icon: getApMarkerIcon({ ...item, tabName }, markerLabel)
        }).addTo(window.apMapLayer);

        marker.markerKey = markerKey;
        window.apMarkerRegistry[markerKey] = marker;

        marker.bindPopup(buildApPopupHtml({ ...item, tabName }, gps, coords));
      }

      window.apMapState.focusedApKey = markerKey;
      window.apMap.flyTo([coords.lat, coords.lng], 16, { animate: true, duration: 1.2 });
      setTimeout(() => {
        if (marker && typeof marker.openPopup === 'function') {
          marker.openPopup();
        }
      }, 250);
    }

    function updateApMapStatus(entries) {
      const badge = document.getElementById('apMapStatusBadge');
      const countBadge = document.getElementById('apMapPointCount');
      const validCount = entries.filter((item) => hasApGpsValue(item.gps)).length;

      if (badge) {
        if (validCount > 0) {
          badge.className = 'badge bg-success';
          badge.textContent = 'Đã load';
        } else {
          badge.className = 'badge bg-warning text-dark';
          badge.textContent = 'Không có GPS';
        }
      }

      if (countBadge) {
        countBadge.textContent = `${validCount} điểm`;
      }
    }

    function renderApMap(entries) {
      const mapHost = document.getElementById('apMapCanvas');
      if (!mapHost) return;

      ensureApMap();
      if (window.apMapState && window.apMapState.skipRender) {
        return;
      }

      const baseEntries = Array.isArray(entries) ? entries : [];
      const displayEntries = baseEntries.filter((item) => hasApGpsValue(item.gps));

      window.apMapState.filteredData = displayEntries;
      const layer = window.apMapState.markersLayer;
      if (layer) {
        layer.clearLayers();
      }
      window.apMapState.markerRegistry = {};
      window.apMarkerRegistry = window.apMapState.markerRegistry;

      updateApMapStatus(displayEntries);
      if (!displayEntries.length) {
        return;
      }

      const markerLabels = resolveApMarkerLabels(displayEntries);
      const validMarkers = [];
      displayEntries.forEach((item) => {
        const gps = normalizeApGpsString(item.gps || '');
        if (!gps) return;
        const coords = parseApGpsCoordinates(gps);
        if (!coords) return;

        const markerKey = getApMarkerKey(item);
        const markerLabel = markerLabels[markerKey] || 'A';
        const marker = L.marker([coords.lat, coords.lng], {
          icon: getApMarkerIcon(item, markerLabel)
        }).addTo(layer);

        marker.markerKey = markerKey;
        window.apMapState.markerRegistry[markerKey] = marker;

        marker.bindPopup(buildApPopupHtml({ ...item, tabName: item.tabName }, gps, coords));
        validMarkers.push(marker);
      });

      if (validMarkers.length) {
        const group = L.featureGroup(validMarkers);
        const bounds = group.getBounds();
        if (bounds && typeof bounds.isValid === 'function' && bounds.isValid()) {
          setTimeout(() => {
            window.apMap.invalidateSize();
            window.apMap.fitBounds(bounds, { padding: [20, 20] });
          }, 50);
        }
      }
    }

    function renderApList() {
      const entries = getVisibleApEntries({ applyNoGpsFilter: true });
      window.apMapState.filteredData = entries;
      window.apMapState.allData = entries;

      const container = document.getElementById('apCardContainer');
      const totalCount = entries.length;
      const noGpsCount = entries.filter((item) => !hasApGpsValue(item.gps)).length;
      document.getElementById('statTotal').innerText = String(totalCount);
      document.getElementById('statNoGps').innerText = String(noGpsCount);
      renderApMap(getVisibleApEntries({ applyNoGpsFilter: false }));

      if (!entries.length) {
        container.innerHTML = '<div class="text-center py-5 text-muted bg-white rounded shadow-sm">Không tìm thấy ấp nào phù hợp.</div>';
        return;
      }

      container.innerHTML = entries.map((item) => {
        const hasGps = hasApGpsValue(item.gps);
        const gpsBadge = hasGps ? '<span class="badge bg-success">Đã có GPS</span>' : '<span class="badge bg-danger">Chưa có GPS</span>';
        const tabLabel = item.tabName === 'ap_new' ? 'Ấp mới' : 'Ấp cũ';
        const rowLabel = `Dòng #${item.rowIndex || ''}`;
        const addressText = getApAddressText(item, item.tabName);
        return `
          <div class="ap-card ${hasGps ? 'has-gps' : 'no-gps'} p-2 border rounded bg-white shadow-sm">
            <div class="d-flex justify-content-between align-items-start mb-1">
              <div>${gpsBadge}<span class="ms-2 small text-primary fw-bold">${tabLabel}</span></div>
              <div class="d-flex gap-1 flex-wrap">
                <button class="btn btn-sm btn-primary fw-bold" onclick="openApGpsModal('${item.tabName}', ${item.rowIndex || 0})">${hasGps ? '✏️ GPS' : '📍 GPS'}</button>
                <button class="btn btn-sm btn-success fw-bold" onclick="focusApMarker('${item.tabName}', ${item.rowIndex || 0})">Đến</button>
                <button class="btn btn-sm btn-warning text-white fw-bold" onclick="openApEditModal('${item.tabName}', ${item.rowIndex || 0})">✏️ Sửa</button>
                <button class="btn btn-sm btn-danger fw-bold" onclick="deleteApLocation('${item.tabName}', ${item.rowIndex || 0})">🗑️</button>
              </div>
            </div>
            <div class="small text-secondary mb-1"><strong>${escapeHtml(item.ap || '---')}</strong> <span class="text-muted">${rowLabel}</span></div>
            <div class="small text-secondary mb-1">${escapeHtml(addressText)}</div>
            <div class="small font-monospace text-dark bg-light p-1 rounded border">
              <b>GPS:</b> ${escapeHtml(normalizeApGpsString(item.gps || '') || '<i>Chưa cập nhật</i>')}
            </div>
          </div>
        `;
      }).join('');
    }

    function openApEditModal(tabName, rowIndex) {
      const item = (allApData[tabName] || []).find((entry) => Number(entry.rowIndex) === Number(rowIndex));
      if (!item) return;

      const fields = tabName === 'ap_new'
        ? [
            { key: 'ap', label: 'Tên ấp' },
            { key: 'xaphuong', label: 'Xã' },
            { key: 'tinhtp', label: 'Tỉnh' }
          ]
        : [
            { key: 'ap', label: 'Tên ấp' },
            { key: 'xaphuong', label: 'Xã' },
            { key: 'quanhuyen', label: 'Huyện' },
            { key: 'tinhtp', label: 'Tỉnh' }
          ];

      const modal = document.getElementById('editApModal');
      if (!modal) {
        const wrapper = document.createElement('div');
        wrapper.innerHTML = `
          <div class="modal fade" id="editApModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
              <div class="modal-content">
                <div class="modal-header bg-warning text-dark">
                  <h5 class="modal-title fw-bold">✏️ Sửa thông tin ấp</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                  <form id="editApForm"></form>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                  <button type="button" class="btn btn-success" onclick="saveApEditForm()">💾 Lưu</button>
                </div>
              </div>
            </div>
          </div>
        `;
        document.body.appendChild(wrapper.firstElementChild);
      }

      const form = document.getElementById('editApForm');
      form.innerHTML = fields.map((field) => `
        <div class="mb-3">
          <label class="form-label fw-bold small">${field.label}</label>
          <input type="text" class="form-control" data-ap-field="${field.key}" value="${escapeHtml(item[field.key] || '')}" />
        </div>
      `).join('');
      currentEditingRow = rowIndex;
      currentEditingTab = tabName;
      const editModal = new bootstrap.Modal(document.getElementById('editApModal'));
      editModal.show();
    }

    async function saveApEditForm() {
      const form = document.getElementById('editApForm');
      if (!form || !currentEditingTab || !currentEditingRow) return;

      const updates = {};
      form.querySelectorAll('[data-ap-field]').forEach((input) => {
        const key = input.getAttribute('data-ap-field');
        if (key) updates[key] = input.value.trim();
      });

      if (!Object.keys(updates).length) return;
      try {
        const result = await window.F88_API.post('updateApRecord', {
          tabName: currentEditingTab,
          rowIndex: Number(currentEditingRow),
          updates
        });
        if (result && result.success) {
          showToast('Đã lưu thông tin ấp thành công!', 'success');
          const modal = bootstrap.Modal.getInstance(document.getElementById('editApModal'));
          if (modal) modal.hide();
          await loadApData();
        } else {
          showToast((result && result.message) || 'Lưu thông tin ấp thất bại.', 'danger');
        }
      } catch (error) {
        showToast('Lỗi khi sửa ấp: ' + error.message, 'danger');
      }
    }

    async function deleteApLocation(tabName, rowIndex) {
      if (!confirm('Bạn muốn xóa ấp này khỏi tab hiện tại?')) return;
      try {
        const result = await window.F88_API.post('deleteApRow', { tabName, rowIndex: Number(rowIndex) });
        if (result && result.success) {
          showToast('Đã xóa ấp thành công.', 'success');
          await loadApData();
        } else {
          showToast((result && result.message) || 'Xóa ấp thất bại.', 'danger');
        }
      } catch (error) {
        showToast('Lỗi xóa ấp: ' + error.message, 'danger');
      }
    }

    function openApGpsModal(tabName, rowIndex) {
      const item = (allApData[tabName] || []).find((entry) => Number(entry.rowIndex) === Number(rowIndex));
      if (!item) return;
      currentEditingRow = rowIndex;
      currentEditingTab = tabName;
      const normalizedGps = normalizeApGpsString(item.gps || '');
      document.getElementById('modalTitle').innerText = `📍 Cập Nhật GPS: ${item.ap || 'Ấp'}`;
      document.getElementById('modalAddressInfo').innerText = `Tab: ${tabName} | ${getApAddressText(item, tabName)}`;
      document.getElementById('modalGpsInput').value = normalizedGps;
      const modal = new bootstrap.Modal(document.getElementById('gpsPickerModal'));
      modal.show();
      setTimeout(() => initMapPicker(normalizedGps), 300);
    }

    function captureCurrentApLocation(tabName, rowIndex) {
      currentEditingRow = rowIndex;
      currentEditingTab = tabName;
      getCurrentLocationMobile();
    }

    function initMapPicker(gpsStr) {
      let initialLat = 10.030;
      let initialLng = 105.770;
      let zoomLevel = 13;
      const normalizedGps = normalizeApGpsString(gpsStr || '');
      const coords = parseApGpsCoordinates(normalizedGps);

      if (coords) {
        initialLat = coords.lat;
        initialLng = coords.lng;
        zoomLevel = 16;
      }

      if (!mapPickerObj) {
        mapPickerObj = L.map('mapPicker').setView([initialLat, initialLng], zoomLevel);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapPickerObj);
        mapPickerObj.on('click', function (e) {
          const lat = e.latlng.lat.toFixed(6);
          const lng = e.latlng.lng.toFixed(6);
          document.getElementById('modalGpsInput').value = `${lat}, ${lng}`;
          setPickerMarker(lat, lng);
        });
      } else {
        mapPickerObj.invalidateSize();
        mapPickerObj.setView([initialLat, initialLng], zoomLevel);
      }

      if (coords) {
        setPickerMarker(coords.lat, coords.lng);
      } else if (pickerMarker) {
        mapPickerObj.removeLayer(pickerMarker);
        pickerMarker = null;
      }
    }

    function setPickerMarker(lat, lng) {
      if (pickerMarker) {
        pickerMarker.setLatLng([lat, lng]);
      } else {
        pickerMarker = L.marker([lat, lng], { draggable: true }).addTo(mapPickerObj);
        pickerMarker.on('dragend', function (e) {
          const pos = e.target.getLatLng();
          document.getElementById('modalGpsInput').value = `${pos.lat.toFixed(6)}, ${pos.lng.toFixed(6)}`;
        });
      }
      mapPickerObj.setView([lat, lng], mapPickerObj.getZoom());
    }

    function getCurrentLocationMobile() {
      if (!navigator.geolocation) {
        alert('Trình duyệt không hỗ trợ định vị!');
        return;
      }
      navigator.geolocation.getCurrentPosition((pos) => {
        const lat = pos.coords.latitude.toFixed(6);
        const lng = pos.coords.longitude.toFixed(6);
        document.getElementById('modalGpsInput').value = `${lat}, ${lng}`;
        setPickerMarker(lat, lng);
        showToast('Đã lấy vị trí hiện tại!');
      }, () => {
        alert('Không thể lấy vị trí hiện tại. Vui lòng cấp quyền GPS.');
      }, { enableHighAccuracy: true });
    }

    async function saveGpsFromModal() {
      const gpsVal = normalizeApGpsString(document.getElementById('modalGpsInput').value.trim());
      if (!gpsVal) {
        alert('Vui lòng nhập hoặc chọn tọa độ GPS!');
        return;
      }

      showToast('Đang lưu tọa độ GPS vào tab ấp...', 'primary');
      try {
        const json = await window.F88_API.post('updateApGps', {
          tabName: currentEditingTab,
          rowIndex: currentEditingRow,
          gps: gpsVal
        });

        if (json && json.success) {
          showToast('Đã lưu tọa độ thành công!', 'success');
          const list = allApData[currentEditingTab] || [];
          const item = list.find((d) => Number(d.rowIndex) === Number(currentEditingRow));
          if (item) item.gps = gpsVal;
          renderApList();
          const gpsModalEl = document.getElementById('gpsPickerModal');
          const gpsModalInst = bootstrap.Modal.getInstance(gpsModalEl);
          if (gpsModalInst) gpsModalInst.hide();
        } else {
          showToast('Lỗi khi lưu: ' + (json && json.message ? json.message : 'Unknown'), 'danger');
        }
      } catch (error) {
        showToast('Lỗi kết nối server: ' + error.message, 'danger');
      }
    }

    function showToast(msg, type = 'success') {
      const c = document.getElementById('statusBox');
      if (c) {
        c.className = 'alert mb-0 alert-' + (type === 'danger' ? 'danger' : type === 'primary' ? 'primary' : 'success');
        c.textContent = msg;
      }
      const toastContainer = document.getElementById('toast-container');
      if (!toastContainer) return;
      const id = 'toast_' + Date.now();
      toastContainer.insertAdjacentHTML('beforeend', `<div id="${id}" class="toast align-items-center text-white bg-${type === 'danger' ? 'danger' : type === 'primary' ? 'primary' : 'success'} border-0 shadow show mb-2"><div class="d-flex"><div class="toast-body fw-bold">${msg}</div></div></div>`);
      setTimeout(() => document.getElementById(id)?.remove(), 2500);
    }

    function setApListPanelState(openState) {
      const btn = document.getElementById('toggleApListBtn');
      const container = document.getElementById('apCardContainer');
      apListExpanded = openState;

      if (btn) {
        btn.textContent = apListExpanded ? '▴ Ẩn danh sách' : '▾ Mở danh sách';
        btn.classList.toggle('btn-outline-primary', !apListExpanded);
        btn.classList.toggle('btn-primary', apListExpanded);
      }

      if (container) {
        container.style.display = apListExpanded ? 'grid' : 'none';
      }

      if (apListExpanded && !apDataLoaded) {
        loadApData({ force: true });
      }

      if (openState && apDataLoaded) {
        renderApList();
      }
    }

    function toggleApListPanel() {
      setApListPanelState(!apListExpanded);
    }

    async function loadApData(options = {}) {
      const { force = false, loadList = true } = options;
      const shouldLoadList = loadList && apListExpanded;

      if (!force && !shouldLoadList && !loadList) {
        apDataLoaded = false;
        const container = document.getElementById('apCardContainer');
        if (container) {
          container.innerHTML = '<div class="text-center py-5 text-muted bg-light rounded border">Danh sách ấp đang được đóng. Nhấn “Mở danh sách” để tải dữ liệu.</div>';
        }
        return;
      }

      if (shouldLoadList || loadList === false) {
        showToast('Đang tải dữ liệu từ các tab Ấp...', 'primary');
      }
      try {
        const json = await window.F88_API.fetch('getApData');
        if (json && json.success) {
          allApData.ap_new = Array.isArray(json.ap_new) ? json.ap_new : [];
          allApData.ap_old = Array.isArray(json.ap_old) ? json.ap_old : [];
          apDataLoaded = true;

          if (apListExpanded && shouldLoadList) {
            renderApList();
          } else if (!apListExpanded) {
            renderApMap(getVisibleApEntries({ applyNoGpsFilter: false }));
          }

          if (shouldLoadList) {
            showToast('Đã tải dữ liệu ấp thành công!', 'success');
          }
        } else {
          showToast('Lỗi tải dữ liệu ấp!', 'danger');
        }
      } catch (error) {
        showToast('Không thể kết nối đến API ấp!', 'danger');
      }
    }

    async function initializePage() {
      apListExpanded = false;
      apDataLoaded = false;

      const selectTab = document.getElementById('selectTab');
      const searchInput = document.getElementById('searchApKeyword');
      const filterNoGps = document.getElementById('filterNoGps');
      const newApGpsInput = document.getElementById('newApGps');
      const saveBtn = document.getElementById('saveNewApLocationBtn');

      if (selectTab) selectTab.addEventListener('change', scheduleApRender);
      if (searchInput) searchInput.addEventListener('input', scheduleApRender);
      if (filterNoGps) filterNoGps.addEventListener('change', scheduleApRender);
      if (newApGpsInput && saveBtn) {
        newApGpsInput.addEventListener('input', () => {
          saveBtn.disabled = !newApGpsInput.value.trim();
        });
      }
      toggleApInsertFields();
      setApListPanelState(false);
      const container = document.getElementById('apCardContainer');
      if (container) {
        container.innerHTML = '<div class="text-center py-5 text-muted bg-light rounded border">Danh sách ấp đang được đóng. Nhấn “Mở danh sách” để tải dữ liệu.</div>';
      }
      setTimeout(() => {
        ensureApMap();
        loadApData({ force: true, loadList: false }).finally(() => {
          setTimeout(() => {
            if (window.apMap) {
              window.apMap.invalidateSize();
              window.apMap.setView([10.03, 105.77], 12);
            }
          }, 300);
        });
      }, 200);
    }

    window.addEventListener('DOMContentLoaded', initializePage);
  </script>
