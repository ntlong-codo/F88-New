<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F88 - Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <style>
    body {
      background: #f4f6f9;
      font-size: 15px;
      color: #1d1d1f;
    }

    .customer-card {
      background: #fff;
      border-radius: 12px;
      border-left: 5px solid #0d6efd;
      margin-bottom: 12px;
      padding: 14px 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .compact-header-menu {
      min-width: 210px;
    }

    .compact-header-menu .dropdown-menu {
      min-width: 210px;
      border: 0;
      box-shadow: 0 12px 26px rgba(0,0,0,0.12);
      border-radius: 12px;
      padding: 8px;
    }

    .top-header-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-actions-right {
      margin-left: auto;
      flex-shrink: 0;
    }

    .compact-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      flex-wrap: wrap;
    }

    .compact-left-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1 1 100%;
      flex-wrap: wrap;
      min-width: 0;
    }

    .compact-search-box {
      flex: 1 1 260px;
      min-width: 0;
      width: 100%;
    }

    @media (max-width: 767.98px) {
      .compact-toolbar {
        flex-wrap: wrap;
      }
      .compact-left-actions {
        flex: 1 1 100%;
        width: 100%;
      }
      .compact-search-box {
        flex: 1 1 100%;
        width: 100%;
      }
      .compact-left-actions .btn {
        padding-left: 0.5rem;
        padding-right: 0.5rem;
      }
    }

    .row-check-ao {
      border-left-color: #6f42c1 !important;
      background: #f8f3ff !important;
    }

    .row-check-gps {
      border-left-color: #198754 !important;
      background: #f2fff8 !important;
    }

    .row-checked-today {
      border-left-color: #198754 !important;
      background: #eafaf1 !important;
      box-shadow: inset 0 0 0 1px rgba(25, 135, 84, 0.18), 0 2px 8px rgba(25, 135, 84, 0.08);
    }

    .sub-section {
      border-left: 3px solid #0d6efd;
      padding-left: 10px;
      margin-top: 8px;
    }

    .customer-badges {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .customer-badge {
      font-size: 11px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: 0.02em;
      border-radius: 999px;
      padding: 5px 9px;
      display: inline-flex;
      align-items: center;
      border: 1px solid transparent;
    }

    .customer-address {
      color: #24476c;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.5;
      letter-spacing: 0.01em;
      opacity: 0.96;
    }

    .card-action-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      flex-shrink: 0;
    }

    .card-action-btn {
      min-width: 0;
      padding: 0.4rem 0.6rem;
      font-size: 12px;
      white-space: nowrap;
    }

    .card-action-btn .btn-label {
      display: inline;
    }

    @media (max-width: 576px) {
      .card-action-group {
        gap: 4px;
      }
      .card-action-btn {
        min-width: 34px;
        width: 34px;
        padding: 0.38rem 0;
        text-align: center;
      }
      .card-action-btn .btn-label {
        display: none;
      }
    }

    #toast-container {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 1055;
      max-width: 420px;
      width: calc(100% - 36px);
    }

    .sync-action-icon {
      display: inline-flex;
      width: 18px;
      height: 18px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 12px;
      line-height: 1;
      transition: transform 0.2s ease;
    }

    .sync-action-icon.sync-running {
      animation: syncSpin 0.9s linear infinite;
    }

    .sync-action-icon.sync-success {
      color: #198754;
    }

    .sync-action-icon.sync-error {
      color: #dc3545;
    }

    @keyframes syncSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .btn,
    .form-select,
    .form-control {
      min-height: 42px;
    }
  </style>
</head>
<body>
  <div id="authOverlay">
    <div class="card p-4 shadow-lg text-center" style="max-width: 380px; width: 90%;">
      <h4 class="mb-3">🔐 BẢO MẬT HỆ THỐNG</h4>
      <input type="password" id="passInput" class="form-control mb-3 text-center fs-5" placeholder="Nhập mật khẩu..." onkeyup="if(event.key==='Enter') checkAuth()" />
      <button class="btn btn-primary w-100 fw-bold" onclick="checkAuth()">XÁC NHẬN</button>
      <div id="authError" class="text-danger small mt-2 d-none">Mật khẩu không chính xác!</div>
    </div>
  </div>

  <div class="container py-3 px-2 d-none" id="mainContent">
    <div class="top-header-row mb-2 bg-white p-2 rounded shadow-sm gap-2">
      <h5 class="mb-0 fw-bold text-primary">📋 F88</h5>
      <div class="d-flex align-items-center gap-2 header-actions-right flex-wrap justify-content-end">
        <button id="manualSyncBtn" class="btn btn-outline-primary btn-sm fw-bold d-flex align-items-center gap-2" type="button" onclick="triggerManualSync()" title="Đồng bộ dữ liệu mới">
          <span id="syncActionIcon" class="sync-action-icon">🔄</span>
          <span class="sync-action-label">Sync</span>
        </button>
        <a href="map.html" class="btn btn-danger btn-sm fw-bold">🗺️ Bản đồ</a>
        <div class="dropdown compact-header-menu">
          <button class="btn btn-primary btn-sm fw-bold dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            ☰ Menu
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
            <li><a class="dropdown-item" href="index.html">📋 Danh sách</a></li>
            <li><a class="dropdown-item" href="map.html">🗺️ Bản đồ</a></li>
            <li><a class="dropdown-item" href="ap.html">🏡 Ấp</a></li>
            <li><a class="dropdown-item" href="payment.html">💰 Khách nguồn</a></li>
            <li><a class="dropdown-item" href="sync.html">🔄 Đồng bộ</a></li>
            <li><hr class="dropdown-divider" /></li>
            <li><button class="dropdown-item text-danger" type="button" onclick="logout()">🔒 Đăng xuất</button></li>
          </ul>
        </div>
      </div>
    </div>

    <div class="card p-2 mb-2 bg-white shadow-sm text-center">
      <div class="row small fw-bold g-1 align-items-center">
        <div class="col-4 border-end">
          <div class="text-secondary mb-1">📂 Tên Kỳ</div>
          <select id="statMonthSelect" class="form-select form-select-sm border-0 bg-light fw-bold text-primary" onchange="syncMonthAndReload(this.value)"></select>
        </div>
        <div class="col-4 border-end">☀️ Check Hôm Nay: <br><span id="statTodayCheck" class="text-warning fs-6">0</span></div>
        <div class="col-4">📊 Tổng Check: <br><span id="statTotalCheck" class="text-success fs-6">0</span></div>
        <div class="col-6 border-top pt-1">🔴 Chưa Check: <br><span id="statUnchecked" class="text-danger fs-6">0</span></div>
        <div class="col-6 border-top pt-1">👥 Tổng Khách: <br><span id="statTotalCust" class="text-dark fs-6">0</span></div>
      </div>
    </div>

    <div class="compact-toolbar mb-3">
      <div class="compact-left-actions">
        <button id="gpsFilterToggleBtn" class="btn btn-outline-danger btn-sm fw-bold text-nowrap" onclick="toggleGpsFilterMode()" aria-label="Lọc GPS">
          <span class="d-none d-sm-inline">📍 Lọc GPS: TẮT</span>
          <span class="d-inline d-sm-none">📍</span>
        </button>
        <button id="apFilterToggleBtn" class="btn btn-outline-primary btn-sm fw-bold text-nowrap" onclick="toggleApFilterMode()" aria-label="Lọc Ấp">
          <span class="d-none d-sm-inline">🏡 Ấp: TẮT</span>
          <span class="d-inline d-sm-none">🏡</span>
        </button>
        <button id="dailyPlanFilterToggleBtn" class="btn btn-outline-info btn-sm fw-bold text-nowrap" onclick="toggleDailyPlanFilterMode()" aria-label="Lọc kế hoạch ngày">
          <span class="d-none d-sm-inline">📅 Kế hoạch ngày: TẮT</span>
          <span class="d-inline d-sm-none">📅</span>
        </button>
        <button id="deadlineSortToggleBtn" class="btn btn-outline-dark btn-sm fw-bold text-nowrap" type="button" onclick="toggleDeadlineSortMode()" aria-label="Sắp xếp theo ngày tới hạn">
          <span class="deadline-sort-label d-none d-sm-inline">🕒 Hạn chót</span>
          <span class="d-inline d-sm-none">🕒</span>
        </button>
        <button id="priorityFilterToggleBtn" class="btn btn-outline-primary btn-sm fw-bold text-nowrap" type="button" onclick="togglePriorityFilterMode()" aria-label="Lọc ưu tiên khách đã phân loại">
          <span class="priority-filter-label d-none d-sm-inline">Ưu tiên</span>
          <span class="d-inline d-sm-none">⭐</span>
        </button>
        <button class="btn btn-outline-primary btn-sm" type="button" data-bs-toggle="offcanvas" data-bs-target="#filterDrawer" aria-label="Bộ lọc">
          <span class="d-none d-sm-inline">⚙️ Lọc</span>
          <span class="d-inline d-sm-none">⚙️</span>
          <span class="d-none d-sm-inline"> (<span id="activeFilterCount">0</span>)</span>
        </button>
        <button id="reloadListUiBtn" class="btn btn-outline-secondary btn-sm fw-bold text-nowrap" type="button" onclick="reloadCurrentListUi()" aria-label="Reload UI danh sách">
          <span class="d-none d-sm-inline">⟳ Reload</span>
          <span class="d-inline d-sm-none">⟳</span>
        </button>
      </div>
      <div class="input-group shadow-sm compact-search-box">
        <input type="text" id="searchKeyword" class="form-control form-control-sm" placeholder="🔍 Tìm tên, số HĐ..." oninput="filterData()" />
      </div>
    </div>

    <div id="apFilterModeSwitch" class="d-none mt-2">
      <div class="btn-group btn-group-sm shadow-sm w-100" role="group" aria-label="Chọn loại ấp">
        <button type="button" class="btn btn-primary" id="apFilterTypeMixedBtn" onclick="setApFilterType('mixed')">Phân Loại Ấp</button>
        <button type="button" class="btn btn-outline-primary" id="apFilterTypeOldBtn" onclick="setApFilterType('ap_old')">Ấp cũ</button>
        <button type="button" class="btn btn-outline-primary" id="apFilterTypeNewBtn" onclick="setApFilterType('ap_new')">Ấp mới</button>
      </div>
    </div>

    <div id="gpsFilterControlBox" class="card p-2 mb-3 bg-light border-danger d-none">
      <div class="row g-2">
        <div class="col-6">
          <label class="small fw-bold text-danger mb-1">🔍 Check:</label>
          <select id="gpsFilterCheckState" class="form-select form-select-sm fw-bold text-danger" onchange="filterData()">
            <option value="ChuaCheck" selected>🔴 Chưa check</option>
            <option value="DaCheckGps">🟢 Đã Check GPS</option>
            <option value="DaCheckAo">🟣 Đã Check Áo</option>
            <option value="">⚡ Tất cả</option>
          </select>
        </div>
        <div class="col-6">
          <label class="small fw-bold text-danger mb-1">📍 Loại GPS:</label>
          <select id="gpsFilterType" class="form-select form-select-sm fw-bold text-primary" onchange="filterData()">
            <option value="all" selected>⚡ Tất cả loại GPS</option>
            <option value="GPS_Chinh">GPS chính</option>
            <option value="GPS_CHECK_1_5">GPS check (1 tới 5)</option>
            <option value="GPS_AP_NEW">Ấp New</option>
            <option value="GPS_AP_OLD">Ấp Old</option>
          </select>
        </div>
      </div>
      <div class="text-center mt-2"><small class="text-muted" id="gpsStatusText">Đang định vị...</small></div>
    </div>

    <div id="customerCardContainer">
      <div class="text-center py-5 text-muted bg-white rounded shadow-sm">
        <div class="spinner-border text-primary mb-2" role="status"></div>
        <div id="loadingStatusText">Đang khởi tạo màn hình...</div>
        <small id="loadingDetailText" class="text-secondary d-block mt-1">Chuẩn bị kết nối API...</small>
      </div>
    </div>
    <div id="customerPageControls"></div>
  </div>

  <div class="offcanvas offcanvas-end" tabindex="-1" id="filterDrawer">
    <div class="offcanvas-header bg-dark text-white">
      <h5 class="offcanvas-title">⚙️ Bộ Lọc Nâng Cao</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <div class="mb-3">
        <label class="form-label fw-bold small">Trạng Thái Check:</label>
        <select id="filterCheck" class="form-select fw-bold text-danger" onchange="filterData(); updateFilterCount();">
          <option value="" selected>⚡ Tất cả</option>
          <option value="ChuaCheck">🔴 Chưa check</option>
          <option value="DaCheck">🟢 Đã check (GPS/Áo)</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">📍 Loại GPS:</label>
        <select id="filterGpsType" class="form-select fw-bold text-primary" onchange="filterData(); updateFilterCount();">
          <option value="all" selected>⚡ Tất cả loại GPS</option>
          <option value="GPS_Chinh">GPS chính</option>
          <option value="GPS_CHECK_1_5">GPS check (1 tới 5)</option>
          <option value="GPS_AP_NEW">Ấp New</option>
          <option value="GPS_AP_OLD">Ấp Old</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Trạng Thái Thanh Toán:</label>
        <select id="filterThanhToan" class="form-select" onchange="filterData(); updateFilterCount();">
          <option value="chua_thanh_toan" selected>Chưa thanh toán (Dưới 500k)</option>
          <option value="da_thanh_toan_tren_500k">Đã thanh toán trên 500.000</option>
          <option value="">Tất cả</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Khả Năng Thanh Toán:</label>
        <select id="filterTrangThaiHd" class="form-select" onchange="filterData(); updateFilterCount();">
          <option value="">Tất cả</option>
          <option value="Chưa biết">Chưa biết</option>
          <option value="Ăn Giựt">Ăn Giựt</option>
          <option value="Mất khả năng TT">Mất khả năng TT</option>
          <option value="Đang kẹt tiền">Đang kẹt tiền</option>
          <option value="Có khả năng">Có khả năng</option>
          <option value="Hẹn Thanh Toán">Hẹn Thanh Toán</option>
          <option value="Nhiều khả năng(Hẹn)">Nhiều khả năng(Hẹn)</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Tìm nhà:</label>
        <select id="filterTimNha" class="form-select" onchange="filterData(); updateFilterCount();">
          <option value="">Tất cả</option>
          <option value="Chưa tìm">Chưa tìm</option>
          <option value="Đã tới Ấp">Đã tới Ấp</option>
          <option value="Bỏ địa phương">Bỏ địa phương</option>
          <option value="Có người biết">Có người biết</option>
          <option value="Gặp người thân">Gặp người thân</option>
          <option value="Gặp khách hàng">Gặp khách hàng</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Độ khó khách hàng:</label>
        <select id="filterDoKho" class="form-select" onchange="filterData(); updateFilterCount();">
          <option value="">Tất cả</option>
          <option value="Dễ làm việc">Dễ làm việc</option>
          <option value="Trung lập">Trung lập</option>
          <option value="Khó Tính">Khó Tính</option>
          <option value="Không hợp tác">Không hợp tác</option>
          <option value="Bạo lực">Bạo lực</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">⏳ Ngày quá hạn:</label>
        <select id="filterDeadline" class="form-select" onchange="filterData(); updateFilterCount();">
          <option value="">Tất cả</option>
          <option value="duoi_4_thang">Dưới 4 tháng</option>
          <option value="duoi_7_thang">Dưới 7 tháng</option>
          <option value="duoi_1_nam">Dưới 1 năm</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">🏠 Lọc theo Thường Trú:</label>
        <input type="text" id="filterThuongTru" class="form-control" placeholder="Nhập tên xã, huyện, tỉnh..." oninput="filterData(); updateFilterCount();" />
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">📍 Shop theo tỉnh:</label>
        <select id="filterProvinceType" class="form-select" onchange="filterData(); updateFilterCount();">
          <option value="all" selected>Tất cả</option>
          <option value="trong_tinh">Shop trong tỉnh</option>
          <option value="ngoai_tinh">Shop ngoại tỉnh</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">🏠 Tạm trú:</label>
        <select id="filterTamTru" class="form-select" onchange="filterData(); updateFilterCount();">
          <option value="all" selected>Tất cả</option>
          <option value="co_tam_tru">Có tạm trú</option>
          <option value="khong_tam_tru">Không tạm trú</option>
        </select>
      </div>
      <button class="btn btn-outline-danger w-100 mt-2" onclick="resetFilters()">🔄 Đặt lại bộ lọc</button>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="api.js"></script>
  <script src="index.js"></script>
</body>
</html>
